
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Меню бота</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:-apple-system,sans-serif;background:var(--tg-theme-bg-color,#f5f5f5);color:var(--tg-theme-text-color,#222);padding:20px;margin:0}
h2{margin-top:12px}
button{width:100%;padding:16px;margin:8px 0;border:0;border-radius:14px;background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff);font-size:16px}
</style>
</head>
<body>
<h2>Меню бота</h2>
<p>Выбери действие</p>
<button onclick="sendAction('help')">Помощь</button>
<button onclick="sendAction('status')">Статус бота</button>
<button onclick="sendAction('settings')">Настройки</button>
<script>
const tg=window.Telegram.WebApp;
tg.ready();
tg.expand();
function sendAction(action){
if(tg.initData){
tg.sendData(JSON.stringify({action}));
}else{
alert('Открой приложение через Telegram');
}
}
</script>
</body>
</html>
