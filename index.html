<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://budget-app-x2s2.onrender.com https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f4fb">
<title>Бюджет</title>
<script>
// Тема: по умолчанию светлая (системную не учитываем), если пользователь выбрал тёмную — помним.
(function(){
  var t='light';
  try{var s=localStorage.getItem('budget_theme');if(s==='dark'||s==='light')t=s;}catch(e){}
  document.documentElement.setAttribute('data-theme',t);
  var m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute('content',t==='dark'?'#05060a':'#f3f4fb');
})();
</script>
<style>
:root{color-scheme:light;--bg:#f3f4fb;--status-bar-bg:#eceefa;--status-bar-fade:#f0f1fa;--card:#fff;--card-grad:linear-gradient(180deg,#ffffff 0%,#fafbff 100%);--text:#1f2340;--muted:#7b8199;--blue:#5267e8;--pink:#ee6f9c;--teal:#20a99b;--violet:#7d6be8;--line:#e9ecf6;--input-bg:#f5f6fc;--input-text:#1f2340;--shadow:inset 0 1px 0 rgba(255,255,255,.95),0 14px 32px -14px rgba(60,72,150,.24),0 2px 6px rgba(60,72,150,.06);--card-border:rgba(125,135,170,.13);--aura:radial-gradient(60% 38% at 0% 0%,rgba(130,145,255,.20),transparent 70%),radial-gradient(55% 34% at 100% 8%,rgba(255,160,200,.17),transparent 70%),radial-gradient(70% 42% at 50% 105%,rgba(110,215,200,.15),transparent 70%);--nav-highlight:#edf1ff;--nav-border:rgba(128,136,158,.18);--nav-active:#e3e8ff;--icon-bg:#f0f3fb;--modal-bg:#fff;--modal-content:#f4f6fb;--close-bg:#eef2fb;--close-text:#3c4664}
:root[data-theme="dark"]{color-scheme:dark;--bg:#05060a;--status-bar-bg:#05060a;--status-bar-fade:#05060a;--card:#12141c;--card-grad:linear-gradient(180deg,#171a24 0%,#10121a 100%);--text:#f2f4fb;--muted:#9aa1b8;--blue:#8f9bff;--pink:#ff7fa9;--teal:#45e0cb;--violet:#a898ff;--line:#262a38;--input-bg:#1a1d29;--input-text:#f2f4fb;--shadow:inset 0 1px 0 rgba(255,255,255,.07),0 18px 40px -16px rgba(0,0,0,.9),0 2px 8px rgba(0,0,0,.5);--card-border:rgba(255,255,255,.07);--aura:radial-gradient(60% 34% at 0% 0%,rgba(110,125,255,.15),transparent 70%),radial-gradient(55% 30% at 100% 5%,rgba(255,110,170,.09),transparent 70%),radial-gradient(70% 40% at 50% 108%,rgba(60,225,200,.08),transparent 70%);--nav-highlight:rgba(255,255,255,.06);--nav-border:rgba(151,160,182,.14);--nav-active:rgba(143,155,255,.18);--icon-bg:#1d2130;--modal-bg:#14161f;--modal-content:#1a1d29;--close-bg:#262a3a;--close-text:#eef2ff}
:root{--bd-on-accent:#fff}
:root[data-theme="dark"]{--bd-on-accent:#0b1020}

*{box-sizing:border-box}
[hidden]{display:none!important}
html::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--aura)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
body::before{position:fixed;z-index:25;top:0;left:0;right:0;height:calc(env(safe-area-inset-top) + 6px);background:linear-gradient(to bottom,var(--status-bar-bg) 0%,transparent 100%);content:"";pointer-events:none}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 18px calc(92px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 14px}
.page-heading{font-size:25px;font-weight:800;letter-spacing:-.7px;margin:0}
.logout{flex:none;height:40px;padding:0 15px;border-radius:13px;border:1px solid var(--card-border);background:var(--card-grad);color:var(--muted);font-size:14px;font-weight:700;box-shadow:var(--shadow);cursor:pointer;transition:transform .3s cubic-bezier(.34,1.5,.4,1)}
.logout:active{transform:scale(.95)}

.sk{display:block;border-radius:10px;background:linear-gradient(100deg,var(--input-bg) 30%,var(--card) 50%,var(--input-bg) 70%);background-size:220% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
/* скелетон повторяет каркас экрана бюджета: шапка месяца, карточка статей, итоги */
.skel-hero{background:var(--card-grad);border:1px solid var(--card-border);border-radius:24px;padding:14px 16px 16px;box-shadow:var(--shadow);margin-bottom:12px}
.skel-mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.skel-mrow .sk{width:40px;height:40px;border-radius:13px;flex:none}
.skel-mrow .sk:nth-child(2){flex:1;height:18px;width:auto}
.skel-tabs{height:56px;border-radius:15px;margin-bottom:16px}
.skel-balance{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:14px}
.skel-balance .sk:first-child{width:108px;height:13px}
.skel-balance .sk:last-child{width:176px;height:42px}
.skel-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.skel-pair .sk{height:62px;border-radius:15px}
.skel-bar{height:7px;border-radius:4px;margin-top:14px}
.skel-card{background:var(--card-grad);border:1px solid var(--card-border);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.skel-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px}
.skel-head .sk{height:16px}
.skel-head .sk:first-child{width:118px}
.skel-head .sk:last-child{width:64px}
.skel-list .skel-row{display:flex;align-items:center;gap:8px;height:62px;padding:0 16px;border-top:1px solid var(--line)}
.skel-dot{width:24px;height:24px;border-radius:50%;flex:none}
.skel-txt{flex:1;height:14px;min-width:0}
.skel-amt{width:58px;height:15px;flex:none}
.skel-check{width:24px;height:24px;border-radius:50%;flex:none}
.skel-add{height:52px;border-radius:16px;margin-top:12px}
.skel-sum{height:250px;border-radius:22px;margin-top:12px}
.loader-cap{margin-top:16px;text-align:center;color:var(--muted);font-size:13px}
.typing{display:inline-flex;gap:3px;margin-left:2px;vertical-align:middle}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.25;animation:tdot 1.5s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,100%{opacity:.25;transform:translateY(0)}35%{opacity:1;transform:translateY(-2px)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}
.login-card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;padding:28px 22px 22px;background:var(--card-grad);border:1px solid var(--card-border);border-radius:25px;box-shadow:var(--shadow)}
.login-ico{width:62px;height:62px;margin:0 auto;border-radius:21px;display:grid;place-items:center;font-size:30px;background:var(--icon-bg)}
.login-card h1{margin:0 0 6px;text-align:center;font-size:24px;font-weight:800;letter-spacing:-.6px}
.login-card .bd-add{margin-top:6px}
.login-error{margin:0;min-height:1.3em;text-align:center;font-size:13px;color:#cf3434}

.value-input{min-width:0;flex:1;border:1px solid var(--line);border-radius:13px;background:var(--input-bg);padding:13px 14px;color:var(--input-text);-webkit-text-fill-color:var(--input-text);caret-color:var(--blue);font-size:15px}
.value-input::placeholder{color:var(--muted);-webkit-text-fill-color:var(--muted);opacity:1}
.value-input:focus{border-color:var(--blue);outline:none}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12.5px;color:var(--muted);text-align:center}
.field .value-input{display:block;width:100%;max-width:100%;min-width:0;font-size:16px;min-height:44px;-webkit-appearance:none;appearance:none;text-align:center;margin:0}
.toast{font-size:12px;color:var(--muted);min-height:16px;margin:8px 2px 0}
.toast:empty{display:none}
.toast.success{color:#168653}
.toast.error{color:#cf3434}

.modal-backdrop{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 14px) 14px 14px;background:rgba(18,24,45,.48);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.modal-backdrop.visible{display:flex;animation:fade .18s ease}
.modal{width:100%;max-width:420px;max-height:calc(100dvh - env(safe-area-inset-top) - 28px);overflow-y:auto;display:flex;flex-direction:column;background:var(--modal-bg);color:var(--text);border-radius:25px;padding:16px 16px 14px;box-shadow:0 25px 80px rgba(0,0,0,.2)}
.modal-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.modal-icon{width:38px;height:38px;border-radius:15px;background:var(--icon-bg);display:grid;place-items:center;font-size:19px}
.modal-title{font-size:19px;font-weight:800}
.form-body{display:flex;flex-direction:column;gap:8px}
.form-actions{display:flex;gap:10px;margin-top:2px}
.btn-cancel{flex:none;min-height:46px;padding:0 16px;border:1px solid var(--line);border-radius:13px;background:var(--input-bg);color:var(--text);font-size:15px;font-weight:700;cursor:pointer;transition:transform .38s cubic-bezier(.34,1.5,.4,1)}
.btn-cancel:active{transform:scale(.95)}
.btn-cancel:disabled{opacity:.5}

.sheet-backdrop{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;padding:14px 10px calc(10px + env(safe-area-inset-bottom));background:rgba(18,24,45,.48);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.sheet-backdrop.visible{display:flex;animation:fade .18s ease}
.sheet{width:100%;max-width:420px;display:flex;flex-direction:column;gap:8px;animation:sheetUp .28s cubic-bezier(.22,1,.36,1)}
.sheet-card{overflow:hidden;background:var(--modal-bg);border-radius:22px;box-shadow:0 25px 80px rgba(0,0,0,.25)}
.sheet-title{padding:16px 18px 2px;text-align:center;font-size:15px;font-weight:800}
.sheet-text{padding:4px 18px 14px;text-align:center;font-size:13px;line-height:1.45;color:var(--muted)}
.sheet-btns{display:flex;flex-direction:column}
.sheet-btn{border:0;border-top:1px solid var(--line);background:transparent;color:var(--blue);padding:15px 12px;font-size:17px;font-weight:650;cursor:pointer}
.sheet-btn:active{background:var(--input-bg)}
.sheet-btn.danger{color:#e5484d}
.sheet-cancel{border:0;border-radius:22px;background:var(--modal-bg);color:var(--blue);padding:15px 12px;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 25px 80px rgba(0,0,0,.25)}
.sheet-cancel:active{background:var(--input-bg)}

/* ---------- бюджет ---------- */
/* ============================================================
   БЮДЖЕТ: кнопка на главной, шапка периода, список статей, формы
   ============================================================ */

:root{--bd-ok:#168653;--bd-over:#cf3434;--bd-over-bg:rgba(207,52,52,.10)}
:root[data-theme="dark"]{--bd-ok:#48cc83;--bd-over:#ff7474;--bd-over-bg:rgba(255,116,116,.14)}

.bd-hero{background:var(--card-grad);border:1px solid var(--card-border);border-radius:24px;padding:10px 14px 12px;box-shadow:var(--shadow);margin-bottom:12px;transition:background .3s,border-color .3s}
.bd-hero.over{background:linear-gradient(180deg,var(--bd-over-bg) 0%,transparent 70%),var(--card-grad);border-color:rgba(207,52,52,.28)}
.bd-month{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.bd-month-title{font-size:19px;font-weight:800;letter-spacing:-.3px;text-align:center;flex:1}
.bd-step{flex:none;width:40px;height:40px;border-radius:13px;border:1px solid var(--card-border);background:var(--input-bg);color:var(--text);font-size:23px;line-height:1;display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .3s cubic-bezier(.34,1.5,.4,1),opacity .2s}
.bd-step:disabled{opacity:.28;cursor:default}
.bd-step:active:not(:disabled){transform:scale(.9)}
.bd-tabs{display:flex;gap:4px;padding:3px;border-radius:15px;background:var(--input-bg);margin-bottom:8px}
.bd-tab{flex:1;min-width:0;min-height:44px;border:0;border-radius:12px;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 4px;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.bd-tab span{font-size:15px;font-weight:750}
.bd-tab small{font-size:11px;font-weight:600;opacity:.8}
.bd-tab.on{background:var(--card);color:var(--text);box-shadow:0 2px 8px rgba(60,72,150,.16)}
.bd-label{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.bd-balance{text-align:center;margin-bottom:8px}
.bd-big{display:block;margin-top:2px;font-size:clamp(24px,8vw,32px);font-weight:800;letter-spacing:-1.2px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.bd-hero.ok .bd-big{color:var(--bd-ok)}
.bd-hero.over .bd-big{color:var(--bd-over)}
.bd-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bd-stat{display:block;text-align:center;border:0;border-radius:15px;background:var(--input-bg);padding:8px 10px;color:var(--text);font:inherit;min-width:0}
button.bd-stat{cursor:pointer;transition:transform .3s cubic-bezier(.34,1.5,.4,1)}
button.bd-stat:active{transform:scale(.97)}
.bd-stat b{display:block;margin-top:2px;font-size:clamp(16px,5.2vw,21px);font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-stat .bd-label i{font-style:normal;margin-left:4px;opacity:.7}
.bd-extra{display:flex;align-items:baseline;justify-content:space-between;gap:8px;width:100%;margin-top:8px;padding:8px 10px;border:0;border-radius:15px;background:var(--input-bg);color:var(--text);font:inherit;cursor:pointer;transition:transform .3s cubic-bezier(.34,1.5,.4,1)}
.bd-extra:active{transform:scale(.98)}
.bd-extra span{font-size:13px;font-weight:700;color:var(--muted)}
.bd-extra b{font-size:16px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums;color:var(--bd-ok);white-space:nowrap}
.bd-bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}
.bd-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#7d8cf5,#5267e8);transition:width .5s cubic-bezier(.22,1,.36,1)}
.bd-hero.over .bd-bar i{background:linear-gradient(90deg,#ff8c8c,#e5484d)}

.bd-card{background:var(--card-grad);border:1px solid var(--card-border);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.bd-card-head{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px 10px;font-size:16px;font-weight:800}
.bd-card-head span{font-size:12px;font-weight:600;color:var(--muted)}
.bd-list{position:relative}
.bd-row{position:relative;display:flex;align-items:center;gap:6px;height:54px;padding:0 2px 0 16px;background:var(--card);border-top:1px solid var(--line);cursor:pointer;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .2s,opacity .2s}
.bd-list.noanim .bd-row{transition:none}
.bd-row:active{background:var(--input-bg)}
.bd-row.lifted{z-index:6;border-radius:16px;border-top-color:transparent;box-shadow:0 14px 34px rgba(0,0,0,.24),0 0 0 .5px var(--card-border);transition:box-shadow .2s;cursor:grabbing;background:var(--card)}
/* статья с подстатьями: блок — единица перетаскивания, подстатьи живут внутри него */
.bd-block{position:relative;transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .2s,opacity .2s}
.bd-list.noanim .bd-block{transition:none}
.bd-block.lifted{z-index:6;border-radius:16px;box-shadow:0 14px 34px rgba(0,0,0,.24),0 0 0 .5px var(--card-border);transition:box-shadow .2s;cursor:grabbing;background:var(--card);overflow:hidden}
.bd-block.holding{animation:bdShimmer .6s ease-in-out infinite}
.bd-subrow{position:relative;display:flex;align-items:center;gap:6px;height:46px;padding:0 16px 0 46px;background:var(--card);border-top:1px solid var(--line);cursor:pointer;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.bd-subrow:active{background:var(--input-bg)}
.bd-subrow .bd-name b{font-size:14px;font-weight:600}
.bd-subrow .bd-sum{font-size:15px}
.bd-subrow.zero .bd-name b,.bd-subrow.zero .bd-sum{color:var(--muted)}
.bd-subrow.done{opacity:.82}
.bd-subrow.done .bd-name b{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted);font-weight:650}
.bd-subrow.done .bd-sum{color:var(--muted);font-weight:650}
.bd-chev{flex:none;width:20px;height:20px;margin-left:4px;color:var(--muted);display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bd-chev svg{width:15px;height:15px;display:block;transition:transform .2s}
.bd-chev.open svg{transform:rotate(180deg)}
/* фильтр статей в шапке карточки */
.bd-fbtn{border:0;background:transparent;color:var(--muted);font-size:15px;width:26px;height:26px;margin-right:6px;padding:0;cursor:pointer;display:inline-grid;place-items:center;vertical-align:-5px}
.bd-fbtn svg{width:17px;height:17px;display:block}
.bd-filterrow{padding:0 16px 8px}
.bd-filterrow .value-input{width:100%}
/* «Остаток»/«Сверх» — строка сверки подстатей с суммой статьи */
.bd-subrow.bd-diff{border-top-style:dashed}
.bd-subrow.bd-diff .bd-name b{color:var(--muted);font-weight:600;font-style:italic}
.bd-subrow.bd-diff .bd-sum{color:var(--muted)}
.bd-subrow .bd-check{width:38px;height:46px}
.bd-subrow .bd-check svg{width:22px;height:22px}
/* строку перетаскивают долгим нажатием в любом месте (стили .holding и .lifted ниже) */
.bd-name{flex:1;min-width:0}
.bd-name b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-name small{display:block;margin-top:2px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-title{display:flex;align-items:center;min-width:0}
.bd-title>b{flex:0 1 auto;min-width:0}
.bd-tag{flex:none;display:inline-grid;place-items:center;width:20px;height:20px;margin-right:8px;border-radius:50%;font-style:normal;font-size:10.5px;font-weight:800;line-height:1;letter-spacing:0}
.bd-tag.perm{background:rgba(32,169,155,.15);color:var(--teal)}
.bd-tag.once{background:rgba(82,103,232,.14);color:var(--blue)}
@supports (color:color-mix(in srgb,red,blue)){
.bd-tag.perm{background:color-mix(in srgb,var(--teal) 15%,transparent)}
.bd-tag.once{background:color-mix(in srgb,var(--blue) 14%,transparent)}
}
.bd-sum{flex:none;max-width:44%;font-size:17px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-sum s.was{color:var(--muted);font-weight:600;font-size:12.5px;text-decoration-thickness:1.5px;margin-right:7px;vertical-align:1px}
.bd-row.zero .bd-name b,.bd-row.zero .bd-sum{color:var(--muted);font-weight:650}
.bd-row.zero{opacity:.72}
.bd-empty{padding:20px 18px 22px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:14px;line-height:1.45}
.privacy-toggle{cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;gap:8px}
.privacy-eye{display:none;width:18px;height:18px;color:var(--muted);flex:none}
#screen-home.privacy .privacy-eye{display:block}
.bd-big,.bd-stat b,.bd-extra b,.bd-lg b,.bd-mrow-top em,.bd-mrow-sub,.bd-ring-in b,.bd-sum,.bd-name b{transition:filter .25s ease}
#screen-home.privacy .bd-big,#screen-home.privacy .bd-stat b,#screen-home.privacy .bd-extra b,#screen-home.privacy .bd-lg b,#screen-home.privacy .bd-mrow-top em,#screen-home.privacy .bd-mrow-sub,#screen-home.privacy .bd-ring-in b,#screen-home.privacy .bd-sum,#screen-home.privacy .bd-name b{filter:blur(8px)}

.bd-add,.bd-month-add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:16px;font-size:16px;font-weight:750;cursor:pointer;transition:transform .3s cubic-bezier(.34,1.5,.4,1),opacity .2s}
.bd-add{margin-top:12px;border:0;background:linear-gradient(180deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 62%),var(--blue);color:var(--bd-on-accent,#fff);box-shadow:0 10px 22px -10px rgba(0,0,0,.4)}
@supports (color:color-mix(in srgb,red,blue)){.bd-add,.bd-save{box-shadow:0 10px 22px -10px color-mix(in srgb,var(--blue) 75%,transparent)}}
.bd-month-add{margin-top:10px;min-height:48px;border:1px solid var(--card-border);background:var(--card-grad);color:var(--text);font-size:15px;box-shadow:var(--shadow)}
.bd-add:active,.bd-month-add:active{transform:scale(.97)}
.bd-add:disabled,.bd-month-add:disabled{opacity:.55;pointer-events:none}
.bd-plus{font-size:22px;font-weight:600;line-height:1;margin-top:-2px}

.bd-first,.bd-ghost{padding:22px 18px;text-align:center}
.bd-ghost{padding:14px 4px 6px}
.bd-ghost h3{margin:0 0 6px;font-size:19px;font-weight:800;letter-spacing:-.3px}
.bd-ghost p{margin:0 0 4px;font-size:14px;line-height:1.45;color:var(--muted)}
.bd-ghost .bd-ico{width:56px;height:56px;margin:0 auto 12px;border-radius:19px;display:grid;place-items:center;font-size:28px;background:var(--icon-bg)}
.bd-hero.ghost .bd-month{margin-bottom:4px}
.bd-first .bd-ico{width:56px;height:56px;margin:0 auto 12px;border-radius:19px;display:grid;place-items:center;font-size:28px;background:var(--icon-bg)}
.bd-first h3{margin:0 0 6px;font-size:19px;font-weight:800}
.bd-first p{margin:0 0 6px;font-size:14px;line-height:1.45;color:var(--muted)}
.bd-error{padding:22px 18px;text-align:center;color:var(--muted);font-size:14px;line-height:1.45}
.bd-error .bd-month-add{width:auto;display:inline-flex;padding:0 22px;margin-top:14px}

/* итоги месяца: кольцо, сводка, полосы по зарплатам */
.bd-sumcard{margin-top:12px;padding-bottom:6px}
.bd-sumcard+.bd-card{margin-top:12px}
.bd-sumtop{display:flex;align-items:center;gap:14px;padding:2px 16px 10px}
.bd-ring{position:relative;flex:none;width:88px;height:88px}
.bd-ring svg{display:block;width:100%;height:100%}
.bd-ring circle{fill:none;stroke-width:10}
.bd-ring .trk{stroke:var(--line)}
.bd-ring .val{stroke:#5267e8;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.22,1,.36,1)}
.bd-sumcard.over .bd-ring .val{stroke:var(--bd-over)}
.bd-ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bd-ring-in b{font-size:19px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.bd-ring-in small{margin-top:1px;font-size:9.5px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;color:var(--muted)}
.bd-legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.bd-lg{display:flex;align-items:baseline;justify-content:flex-end;gap:10px;min-width:0}
.bd-lg span{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.bd-lg b{font-size:15px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-lg.tot{margin-top:1px;padding-top:7px;border-top:1px solid var(--line)}
.bd-lg.tot b{font-size:18px}
.bd-sumcard.ok .bd-lg.tot b{color:var(--bd-ok)}
.bd-sumcard.over .bd-lg.tot b{color:var(--bd-over)}
.bd-mrows{border-top:1px solid var(--line)}
.bd-mrow{padding:9px 16px 10px;border-bottom:1px solid var(--line)}
.bd-mrow:last-child{border-bottom:0}
.bd-mrow-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.bd-mrow-top span{font-size:14px;font-weight:700;color:var(--muted)}
.bd-mrow.on .bd-mrow-top span{color:var(--text)}
.bd-mrow-top em{font-style:normal;font-size:16px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.bd-mrow.ok em{color:var(--bd-ok)}
.bd-mrow.over em{color:var(--bd-over)}
.bd-mrow .bd-bar{height:6px;margin-top:6px}
.bd-mrow:not(.on) .bd-bar i{opacity:.55}
.bd-mrow.over .bd-bar i{background:linear-gradient(90deg,#ff8c8c,#e5484d)}
.bd-mrow-sub{margin-top:4px;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}

/* формы и подтверждения */
.bd-save{flex:1;min-height:46px;font-size:16px;border:0;background:linear-gradient(180deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 62%),var(--blue);color:var(--bd-on-accent,#fff)}
.bd-seg{display:flex;gap:4px;padding:3px;border-radius:14px;background:var(--input-bg);border:1px solid var(--line)}
.bd-seg button{flex:1;min-height:40px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-size:15px;font-weight:700;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.bd-seg button.on{background:var(--card);color:var(--text);box-shadow:0 2px 8px rgba(60,72,150,.16)}
.bd-hint{margin:-2px 2px 0;font-size:12px;line-height:1.4;color:var(--muted);text-align:center}
.value-input.bd-left{text-align:left;padding-left:14px;padding-right:14px}
#budgetFormBackdrop input[type="month"]{overflow:hidden;padding-left:10px;padding-right:10px}
#budgetFormBackdrop input[type="month"]::-webkit-date-and-time-value{text-align:center;margin:0;min-width:0}
.bd-links{display:flex;justify-content:center;gap:6px;margin-top:10px}
.bd-links:empty{display:none}
.bd-link{flex:1;min-height:42px;border:0;border-radius:12px;background:transparent;color:var(--blue);font-size:14.5px;font-weight:700;cursor:pointer}
.bd-link.danger{color:var(--bd-over,#cf3434)}
.bd-link:active{background:var(--input-bg)}
.bd-link:disabled{opacity:.5}

/* ============================================================
   Дополнения: шапка, тема, отметка «выполнено», мерцание, автозаполнение
   ============================================================ */
:root{--hold-tint:rgba(82,103,232,.16)}
:root[data-theme="dark"]{--hold-tint:rgba(143,155,255,.26)}

/* шапка: иконки рядом с «Выйти» */
.page-heading{min-width:0}
.topbar-actions{flex:none;display:flex;align-items:center;gap:8px}
.icon-btn{flex:none;width:40px;height:40px;padding:0;border-radius:13px;border:1px solid var(--card-border);background:var(--card-grad);color:var(--muted);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;text-decoration:none;-webkit-tap-highlight-color:transparent;transition:transform .3s cubic-bezier(.34,1.5,.4,1)}
.icon-btn:active{transform:scale(.93)}
.icon-btn svg{display:block;width:22px;height:22px}
.icon-btn[aria-disabled="true"]{opacity:.5;cursor:default}
.icon-btn.sheet svg{width:28px;height:28px}
.theme-btn .ico-sun{display:none}
:root[data-theme="dark"] .theme-btn .ico-sun{display:block}
:root[data-theme="dark"] .theme-btn .ico-moon{display:none}

/* вход: подписи полей прижаты к левому краю */
.login-card .field>span{text-align:left;padding-left:2px}

/* автозаполнение браузера: свой фон и цвет текста вместо жёлтой подсветки */
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus,input:-webkit-autofill:active{-webkit-text-fill-color:var(--input-text)!important;caret-color:var(--input-text);-webkit-box-shadow:0 0 0 1000px var(--input-bg) inset!important;box-shadow:0 0 0 1000px var(--input-bg) inset!important;border-color:var(--line);transition:background-color 600000s 0s,color 600000s 0s}
input:autofill{-webkit-text-fill-color:var(--input-text)!important;box-shadow:0 0 0 1000px var(--input-bg) inset!important}

/* отметка «выполнено» */
.bd-check{flex:none;width:48px;height:62px;border:0;padding:0;background:transparent;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bd-check svg{display:block;width:26px;height:26px;overflow:visible;transition:transform .3s cubic-bezier(.34,1.5,.4,1)}
.bd-check:active svg{transform:scale(.86)}
.bd-check .ring{fill:transparent;stroke:var(--muted);stroke-width:1.8;opacity:.75;transition:fill .2s,stroke .2s,opacity .2s}
.bd-check .tick{fill:none;stroke:var(--bd-on-accent,#fff);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:16;stroke-dashoffset:16;transition:stroke-dashoffset .28s ease .05s}
.bd-row.done .bd-check .ring{fill:var(--bd-ok);stroke:var(--bd-ok);opacity:1}
.bd-row.done .bd-check .tick{stroke-dashoffset:0}
.bd-row.done .bd-name b{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted);font-weight:650}
.bd-row.done .bd-sum{color:var(--muted);font-weight:650}
.bd-row.done{opacity:.82}
.bd-row.done .bk-info .bd-title b{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted);font-weight:650}
.bd-row.done .bk-sub,.bd-row.done .bk-sum,.bd-row.done .bk-qn{color:var(--muted)}
.bd-row.done .bk-qty{opacity:.55}

/* мерцание строки: держишь нажатым — через 2 секунды строку можно тащить */
.bd-row.holding{animation:bdShimmer .6s ease-in-out infinite}
@keyframes bdShimmer{
 0%,100%{box-shadow:inset 0 0 0 0 var(--hold-tint),inset 0 0 0 0 var(--blue)}
 50%{box-shadow:inset 0 0 0 80px var(--hold-tint),inset 0 0 0 2px var(--blue)}
}

/* кнопки в окне статьи: аккуратно закруглены */
.bd-save,.btn-cancel{border-radius:16px}
.bd-save{font-weight:750;cursor:pointer;transition:transform .3s cubic-bezier(.34,1.5,.4,1),opacity .2s}
.bd-save:active{transform:scale(.97)}
.bd-save:disabled{opacity:.55}



/* ===== Нижняя навигация: стеклянная капсула ===== */
.bottom-nav-wrap{position:fixed;z-index:20;bottom:0;left:0;right:0;padding:0 12px calc(6px + env(safe-area-inset-bottom));pointer-events:none;transition:transform .22s ease,opacity .18s ease}
.bottom-nav{position:relative;isolation:isolate;pointer-events:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;width:min(83.333vw,484px);height:62px;margin:0 auto;border:0;border-radius:999px;overflow:hidden;background:radial-gradient(ellipse 130% 90% at 50% 0%,rgba(255,255,255,.180) 0%,rgba(255,255,255,.100) 45%,rgba(255,255,255,.050) 100%);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:0 15px 45px -11px rgba(0,0,0,.283),0 1px 2px rgba(0,0,0,.141),inset 0 0 8px rgba(255,255,255,.098),inset 0 4px 8px -4px rgba(0,0,0,.060),inset 0 -1px 1px rgba(255,255,255,.154),inset 0 1px 1px rgba(255,255,255,.700),inset 0 0 0 1px rgba(255,255,255,.380)}
.bottom-nav::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse 110% 65% at 50% -15%,rgba(255,255,255,.550) 0%,rgba(255,255,255,0) 70%);mix-blend-mode:screen;pointer-events:none;z-index:1}
.bottom-nav::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.530),inset 0 1px 0 rgba(255,255,255,.800),inset 0 -1px 0 rgba(255,255,255,.175);pointer-events:none;z-index:1}
.bottom-nav .nav-button{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;height:56px;padding:2px;border:0;border-radius:999px;color:rgba(17,19,27,.72);background:transparent;font:inherit;font-size:11px;font-weight:600;letter-spacing:.1px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:color .2s,transform .2s}
.bottom-nav .nav-button.active{background:transparent;color:var(--text);box-shadow:none}
.bottom-nav .nav-button:active{transform:scale(.97)}
.bottom-nav .nav-icon{width:38px;height:38px;display:grid;place-items:center;transition:transform .4s cubic-bezier(.34,1.5,.4,1),opacity .3s}
.bottom-nav .nav-icon svg{display:block;width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bottom-nav .nav-button:not(.active) .nav-icon{transform:scale(.94);opacity:.78}
.bottom-nav .nav-button.active .nav-icon{transform:scale(1.08) translateY(-1px);opacity:1}
.nav-label{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.15}
.bottom-nav .nav-pill{position:absolute;top:3px;left:0;height:calc(100% - 6px);width:calc(100% / 3 - 4px);border-radius:999px;z-index:0;pointer-events:none;transform:translateX(0);overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.84),rgba(255,255,255,.3));border:1px solid rgba(255,255,255,.85);box-shadow:0 3px 12px rgba(96,125,165,.11),inset 0 1px 2px #fff,-webkit-backdrop-filter:blur(15px) brightness(1.08) saturate(160%);backdrop-filter:blur(15px) brightness(1.08) saturate(160%);transition:transform .55s cubic-bezier(.22,1.3,.35,1),width .45s cubic-bezier(.22,1.3,.35,1);will-change:transform,width}
.bottom-nav .nav-pill::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse at 25% 0%,rgba(255,255,255,.6),transparent 60%);pointer-events:none}
:root[data-theme="dark"] .bottom-nav{background:radial-gradient(ellipse 130% 90% at 50% 0%,rgba(255,255,255,.10) 0%,rgba(255,255,255,.05) 45%,rgba(255,255,255,.02) 100%);box-shadow:0 15px 45px -11px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.35),inset 0 0 8px rgba(255,255,255,.06),inset 0 4px 8px -4px rgba(0,0,0,.20),inset 0 -1px 1px rgba(255,255,255,.08),inset 0 1px 1px rgba(255,255,255,.20),inset 0 0 0 1px rgba(255,255,255,.14)}
:root[data-theme="dark"] .bottom-nav .nav-button{color:rgba(255,255,255,.78)}
:root[data-theme="dark"] .bottom-nav .nav-button.active{color:#fff}
:root[data-theme="dark"] .bottom-nav .nav-pill{background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(255,255,255,.07));border-color:rgba(255,255,255,.2);box-shadow:0 3px 12px rgba(0,0,0,.35),inset 0 1px 2px rgba(255,255,255,.28)}
:root[data-theme="dark"] .bottom-nav .nav-pill::before{opacity:.35}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.bottom-nav{background:rgba(255,255,255,.60)}:root[data-theme="dark"] .bottom-nav{background:rgba(38,38,40,.80)}}
body.keyboard-open .bottom-nav-wrap{transform:translateY(140%);opacity:0;pointer-events:none}
@media(prefers-reduced-motion:reduce){.bottom-nav .nav-button,.bottom-nav .nav-icon,.bottom-nav .nav-pill{transition:none}}
@media(max-width:360px){.bottom-nav{height:58px}.bottom-nav .nav-button{height:52px}.bottom-nav .nav-icon{width:34px;height:34px}.bottom-nav .nav-icon svg{width:34px;height:34px}}

/* ===== Настройки: группы в стиле iOS ===== */
.st-card{background:var(--card-grad);border:1px solid var(--card-border);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.st-row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 15px;border:0;background:none;color:inherit;font:inherit;font-size:15px;text-align:left;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.st-row:not(:first-child)::before{content:"";position:absolute;top:0;left:57px;right:0;height:1px;background:var(--line)}
.st-row:active{background:var(--input-bg)}
.st-ico{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;color:#fff}
.st-ico svg{width:17px;height:17px;display:block}
.c-green{background:linear-gradient(#4fd96d,#2fbf55)}
.c-sky{background:linear-gradient(#5cc4f7,#2fa8ee)}
.c-violet{background:linear-gradient(#9a86f5,#7d6be8)}
.c-red{background:linear-gradient(#ff6b5e,#f2493c)}
.st-copy{flex:1;min-width:0}
.st-t{display:block;font-size:15px;font-weight:650;line-height:1.25}
.st-s{display:block;font-size:12.5px;line-height:1.3;color:var(--muted);margin-top:1px}
.st-chev{width:8px;height:14px;flex:none;color:var(--muted)}
.st-row[aria-disabled="true"]{opacity:.55}
.st-danger .st-t{color:#e5484d}
.ios-switch{position:relative;width:51px;height:31px;flex:none;border-radius:999px;background:var(--input-bg);border:1px solid var(--card-border);transition:background .25s,border-color .25s}
.ios-switch i{position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.04);transition:transform .28s cubic-bezier(.3,1.4,.4,1)}
:root[data-theme="dark"] .ios-switch{background:#34c759;border-color:transparent}
:root[data-theme="dark"] .ios-switch i{transform:translateX(20px)}
/* корзина покупок */
.bk-info{flex:1;min-width:0}
.bk-sub{display:block;margin-top:2px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-qty{flex:none;display:flex;align-items:center;gap:2px}
.bk-q{width:30px;height:30px;border-radius:10px;border:1px solid var(--card-border);background:var(--input-bg);color:var(--text);font-size:18px;font-weight:700;line-height:1;display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .15s,opacity .15s}
.bk-q:active{transform:scale(.88)}
.bk-q:disabled{opacity:.3;cursor:default}
.bk-qn{min-width:24px;text-align:center;font-size:15px;font-weight:750;font-variant-numeric:tabular-nums}
.bk-sum{flex:none;width:92px;text-align:right;font-size:16px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-bought-label{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px 4px;font-size:11.5px;font-weight:750;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.bk-uncheck{border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:700;letter-spacing:0;text-transform:none;padding:6px 2px 6px 8px;margin:-6px -2px -6px 0;cursor:pointer}
.bk-uncheck:active{opacity:.6}
.bd-row.noprice .bk-sum{color:#e5484d}
.bd-row.bk-pending{animation:bkPend .7s ease-in-out infinite}
.bk-pending .bk-qn,.bk-pending .bk-sum{color:#e5484d}
@keyframes bkPend{0%,100%{background:var(--card)}50%{background:rgba(229,72,77,.16)}}
.bk-suggest{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 14px}
.bk-form-row{display:flex;gap:8px;align-items:flex-end}
.bk-form-row .field{flex:1;min-width:0}
.bk-form-row .bk-unit{flex:none;width:118px}
.bk-form-row .bk-unit .bd-seg button{font-size:13.5px;padding:0 2px}
.bk-suggest:empty{display:none}
.bk-sug{border:1.5px solid rgba(32,169,155,.5);background:rgba(32,169,155,.12);color:var(--text);font:inherit;font-size:15px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer;-webkit-tap-highlight-color:transparent;animation:bkSugIn .28s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i,0)*24ms)}
.bk-sug b{font-weight:850;color:#13867a;background:rgba(32,169,155,.2);border-radius:5px;padding:0 1px}
:root[data-theme="dark"] .bk-sug b{color:#7cf0de;background:rgba(69,224,203,.2)}
.bk-sug:active{transform:scale(.94)}
@keyframes bkSugIn{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
.bk-total{position:sticky;bottom:calc(78px + env(safe-area-inset-bottom));z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:13px 16px;border-radius:18px;background:var(--card-grad);border:1px solid var(--card-border);box-shadow:var(--shadow)}
.bk-total>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.bk-total>div>span{font-size:14px;font-weight:700;color:var(--muted)}
.bk-total>b{font-size:20px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bk-total small{font-size:11.5px;font-weight:600;color:var(--muted)}
.st-foot{font-size:12.5px;line-height:1.4;color:var(--muted);padding:0 15px}
/* статистика сервера (попап из настроек) */
.st-stat-title{padding:12px 4px 2px;font-size:11.5px;font-weight:750;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.st-stat{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px}
.st-stat:last-child{border-bottom:0}
.st-stat>span{color:var(--muted);min-width:0}
.st-stat>b{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.st-stat .st-warn{color:#e5484d;font-weight:700}
</style>
</head>

// ---------- вход по логину и паролю (как было) ----------
const API="https://script.google.com/macros/s/AKfycbw2S8nKASSRnuIu_gW60rnr26mUgySNp1Kk0yxG91EcId_gBSqcpErzmnrIjX98_UUb/exec";
const TOKEN_KEY="budget_token";

function getToken(){try{return localStorage.getItem(TOKEN_KEY);}catch(e){return null;}}
function setToken(t){
  try{
    if(t)localStorage.setItem(TOKEN_KEY,t);
    else localStorage.removeItem(TOKEN_KEY);
  }catch(e){}
}

async function api(path,options={}){
  const method=(options.method||"GET").toUpperCase();
  const token=getToken();
  const payload={
    method,
    path,
    token:token||"",
    body:options.body||"{}"
  };
  const res=await fetch(API,{
    method:"POST",
    headers:{"Content-Type":"text/plain"},
    body:JSON.stringify(payload)
  });
  const proxy=await res.json();
  const status=Number(proxy.status||502);
  let data=null;
  try{data=JSON.parse(proxy.body);}catch(e){data={error:proxy.body||"Proxy error"};}
  return {status,ok:status>=200&&status<300,data};
}

// запрос бюджета: возвращает data, при ошибке бросает Error со status; 401 — сразу на экран входа
async function request(path,options){
  const {status,ok,data}=await api(path,options);
  if(status===401){
    onSessionExpired();
    const error=new Error((data&&data.error)||'Требуется вход');
    error.status=401;
    throw error;
  }
  if(!ok||!data||!data.ok){
    const error=new Error((data&&data.error)||('Ошибка '+status));
    error.status=status;
    throw error;
  }
  return data.data;
}
const get=path=>request(path);
const post=(path,payload)=>request(path,{method:'POST',body:JSON.stringify(payload||{})});

// ---------- статистика сервера (Render + приложение) ----------
const statsBackdrop=$('statsBackdrop');
function closeStats(){statsBackdrop.classList.remove('visible');}
function pluralLocal(n,forms){
  const a=Math.abs(n)%100,b=a%10;
  return a>10&&a<20?forms[2]:b===1?forms[0]:b>=2&&b<=4?forms[1]:forms[2];
}
function fmtUptime(sec){
  sec=Math.max(0,Math.floor(Number(sec)||0));
  const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60);
  if(d)return d+' '+pluralLocal(d,['день','дня','дней'])+' '+h+' ч';
  if(h)return h+' ч '+m+' мин';
  return m+' мин';
}
const statRow=(label,value,cls)=>'<div class="st-stat"><span>'+label+'</span><b'+(cls?' class="'+cls+'"':'')+'>'+value+'</b></div>';
// метрики Render приходят как {value, unit}; unit — строка ("GB", "percent", "seconds"…)
function fmtMetric(x){
  if(!x||x.value==null)return null;
  const n=Number(x.value);
  if(!isFinite(n))return null;
  const u=String(x.unit||'').toLowerCase();
  if(u.includes('gb')||u==='gib')return Math.round(n*1024)+' МБ';
  if(u.includes('mb')||u.includes('megabyte'))return Math.round(n)+' МБ';
  if(u.includes('byte'))return (n/1048576).toFixed(1)+' МБ';
  if(u.includes('ms')||u.includes('millisecond'))return Math.round(n)+' мс';
  if(u.includes('second'))return n<10?(n*1000).toFixed(0)+' мс':n.toFixed(1)+' с';
  if(u.includes('percent')||u==='%'||u==='pct')return (n<=1?n*100:n).toFixed(1)+'%';
  if(u.includes('cpu'))return (n*100).toFixed(2)+'%';
  if(u.includes('count')||u.includes('instance')||u==='')return Math.round(n).toLocaleString('ru-RU');
  return n+' '+u;
}
const metricPair=(a,b)=>{const x=fmtMetric(a),y=fmtMetric(b);return x==null?y:y==null?x:x+' / '+y;};
const usagePct=(u,l)=>{const a=Number(u&&u.value),b=Number(l&&l.value);return b>0?(a/b*100):null;};
function statsHtml(d){
  const escV=v=>escapeHtml(String(v==null||v===''?'—':v));
  let html='<div class="st-stat-title">Приложение</div>'
   +statRow('Аптайм',escV(fmtUptime(d.uptime_seconds)))
   +statRow('Запросов всего',escV((d.requests||0).toLocaleString('ru-RU')))
   +statRow('Память сейчас',escV(d.memory_mb!=null?d.memory_mb+' МБ':null))
   +statRow('Память пиковая',escV(d.peak_memory_mb!=null?d.peak_memory_mb+' МБ':null))
   +statRow('CPU (в среднем)',escV(d.cpu_percent!=null?d.cpu_percent+'%':'—'));
  const r=d.render||{};
  const dashUrl=(typeof r.dashboard_url==='string'&&r.dashboard_url.startsWith('https://'))?r.dashboard_url:null;
  html+='<div class="st-stat-title">'+(dashUrl?'<a href="'+escV(dashUrl)+'" target="_blank" rel="noopener noreferrer" style="color:inherit">Render</a>':'Render')+'</div>';
  if(!r.configured){
    html+=statRow('Статус','не настроен');
  }else if(!r.ok){
    html+=statRow('Статус',escV(r.error||'недоступен'),'st-warn');
  }else{
    const m=r.metrics||{};
    const cpuPct=usagePct(m.cpu,m.cpu_limit);
    const cpuTxt=cpuPct!=null?cpuPct.toFixed(1)+'%':metricPair(m.cpu,m.cpu_limit);
    const memBase=metricPair(m.memory,m.memory_limit);
    const memPct=usagePct(m.memory,m.memory_limit);
    const memTxt=memBase==null?null:memBase+(memPct!=null?' ('+memPct.toFixed(0)+'%)':'');
    html+=(cpuTxt?statRow('CPU',escV(cpuTxt)):'')
     +(memTxt?statRow('Память',escV(memTxt)):'')
     +(m.http_latency?statRow('Задержка HTTP',escV(fmtMetric(m.http_latency))):'')
     +(m.instance_count?statRow('Инстансы',escV(fmtMetric(m.instance_count))):'')
     +(r.created_at?statRow('Создан',escV(new Date(r.created_at).toLocaleDateString('ru-RU'))):'');
  }
  return html;
}
async function openStats(){
  statsBackdrop.classList.add('visible');

}

const homeEl=$('screen-home');
const privacyToggle=$('privacyToggle');
let privacy=false,privacyAuto=false,orientReady=false,downAt=0,flipped=false;
function setPrivacy(on,auto){
  privacy=on;privacyAuto=!!auto;
  homeEl.classList.toggle('privacy',on);
  privacyToggle.title=on?'Показать суммы':'Скрыть суммы';

privacyToggle.addEventListener('click',()=>{setPrivacy(!privacy,false);ensureOrientation();});
function ensureOrientation(){
  if(orientReady||typeof DeviceOrientationEvent==='undefined')return;
  if(typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted')startOrientation();}).catch(()=>{});
  }else startOrientation();
}
function startOrientation(){
  if(orientReady)return;
  orientReady=true;
  window.addEventListener('deviceorientation',e=>{
    if(e.beta==null)return;
    const b=Math.abs(e.beta),now=performance.now();
    if(b>140){if(!downAt)downAt=now;else if(now-downAt>350&&!flipped){flipped=true;setPrivacy(!privacy,true);}}
    else{downAt=0;flipped=false;}
  },{passive:true});
}

// БЮДЖЕТ: зарплатные периоды и статьи расходов (лист cost)
// ============================================================
(function(){
'use strict';
const $=id=>document.getElementById(id);
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WEEKDAYS=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const MAX_AHEAD=24;    // сколько месяцев вперёд можно добавить за раз (как на сервере)
const S={state:null,sel:null,ghost:null,busy:false,loading:false,seq:0,dragging:false,pendingRender:false,noClick:false,doneOps:0,expanded:new Set(),filterOn:false,filter:''};
const nf=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2});
const money=n=>nf.format(n)+'\u00a0₽';
const signed=n=>n>0?'+'+money(n):money(n);      // положительный остаток — со знаком «+»
const r2=n=>Math.round(n*100)/100;
const esc=value=>escapeHtml(value);
const isOpen=()=>!$('budgetView').hidden&&!$('screen-home').hidden;

// ---------- даты ----------
function todayIso(){
 // «сегодня» считаем по Москве, как и на сервере
 try{
  const s=new Date().toLocaleDateString('en-CA',{timeZone:'Europe/Moscow'});
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
 }catch(e){}
 const d=new Date();
 return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dayInfo(iso){
 const [y,m,d]=iso.split('-').map(Number);
 return {y,m,d,wd:new Date(Date.UTC(y,m-1,d)).getUTCDay()};
}
const dayLabel=iso=>{const i=dayInfo(iso);return i.d+' '+MONTHS_GEN[i.m-1];};
const monthTitle=key=>{const [y,m]=key.split('-').map(Number);return MONTHS[m-1]+' '+y;};
const monthTitleGen=key=>{const [y,m]=key.split('-').map(Number);return MONTHS_GEN[m-1]+' '+y;};
const monthIdx=key=>{const [y,m]=key.split('-').map(Number);return y*12+m-1;};
const keyOf=i=>Math.floor(i/12)+'-'+String(i%12+1).padStart(2,'0');
const monthWord=n=>plural(n,['месяц','месяца','месяцев']);
function plural(n,forms){
 const a=Math.abs(n)%100,b=a%10;
 return a>10&&a<20?forms[2]:b===1?forms[0]:b>=2&&b<=4?forms[1]:forms[2];
}

// ---------- состояние ----------
// Открываем ближайшую будущую зарплату (14-го — зарплату 17-го); если будущих нет — последнюю.
function defaultSel(periods){
 const today=todayIso();
 const upcoming=periods.find(p=>p.pay_date>=today);
 return (upcoming||periods[periods.length-1]).pay_date;
}
// Ссылка на Google Таблицу в шапке: показываем, только если адрес точно похож на ссылку на таблицу Google.
function setSheetLink(url){
 const a=$('sheetLink');
 if(!a)return;
 if(typeof url==='string'&&/^https:\/\/docs\.google\.com\/spreadsheets\/d\/[\w-]+\/edit(#gid=\d+)?$/.test(url)){
  a.href=url;
  a.removeAttribute('aria-disabled');
  a.title='Открыть таблицу';
 }else{
  a.removeAttribute('href');
  a.setAttribute('aria-disabled','true');
  a.title='Таблица ещё загружается';
 }
}
function adopt(data,focus){
 S.state=data;
 setSheetLink(data.sheet_url);
 const dates=data.periods.map(p=>p.pay_date);
 if(focus&&dates.includes(focus)){S.sel=focus;S.ghost=null;return;}
 // пока смотрели «ещё не созданный» месяц, его могли создать — тогда показываем уже настоящий
 if(S.ghost&&(!dates.length||data.periods.some(p=>p.month===S.ghost)))S.ghost=null;
 if(!S.sel||!dates.includes(S.sel))S.sel=dates.length?defaultSel(data.periods):null;
}
function monthBounds(){
 const months=S.state.periods.map(p=>p.month);
 return {first:months[0],last:months[months.length-1]};
}
const current=()=>S.state?S.state.periods.find(p=>p.pay_date===S.sel)||null:null;

// ---------- отрисовка ----------
function monthNavHtml(key){
 const {first,last}=monthBounds();
 const i=monthIdx(key);
 return '<div class="bd-month"><button class="bd-step" type="button" data-act="prev" aria-label="Предыдущий месяц"'+(i<=monthIdx(first)?' disabled':'')+'>‹</button>'
  +'<div class="bd-month-title">'+monthTitle(key)+'</div>'
  +'<button class="bd-step" type="button" data-act="next" aria-label="Следующий месяц"'+(i>=monthIdx(last)+MAX_AHEAD?' disabled':'')+'>›</button></div>';
}
function heroHtml(p){
 const periods=S.state.periods;
 const inMonth=periods.filter(x=>x.month===p.month);
 const over=p.balance<0;
 const cls=over?'over':(p.balance>0?'ok':'');
 const pct=p.income>0?Math.min(100,Math.round(p.expenses/p.income*100)):(p.expenses>0?100:0);
 const tabs=inMonth.map(x=>'<button class="bd-tab'+(x.pay_date===p.pay_date?' on':'')+'" type="button" data-act="tab" data-date="'+x.pay_date+'"><span>'+dayLabel(x.pay_date)+'</span><small>'+WEEKDAYS[dayInfo(x.pay_date).wd]+'</small></button>').join('');
 return '<section class="bd-hero '+cls+'">'+monthNavHtml(p.month)
  +'<div class="bd-tabs">'+tabs+'</div>'
  +'<div class="bd-balance"><span class="bd-label">'+(over?'Превышение расходов':'Остаток')+'</span><span class="bd-big">'+signed(p.balance)+'</span></div>'

  +'<div class="bd-stat"><span class="bd-label">Расходы</span><b>'+money(p.expenses)+'</b></div></div>'

// Итоги месяца: кольцо «сколько зарплат потрачено», сводка и полоса по каждой зарплате.

function bodyHtml(){
 const st=S.state;
 if(!st.periods.length)return firstHtml();
 if(S.ghost)return ghostHtml(S.ghost);
 const p=current()||st.periods[0];
 const tops=p.items.filter(x=>x.level!==2);          // в счётчиках и списке — только статьи
 const n=tops.length;
 const nd=tops.filter(x=>x.done).length;
 // блоки «статья + подстатьи»: подстатьи идут в items сразу после своей статьи
 const byId=new Map(),blocks=[];
 tops.forEach(it=>{const b={it,kids:[]};byId.set(it.id,b);blocks.push(b);});
 p.items.forEach(it=>{if(it.level===2&&it.parent!=null){const b=byId.get(it.parent);if(b)b.kids.push(it);}});
 // фильтр по названию: статья подходит сама или по подстатьям
 const q=(S.filter||'').trim().toLowerCase();
 const norm=s=>String(s).toLowerCase().replace(/ё/g,'е');
 const match=name=>!q||norm(name).includes(q);
 const shown=blocks.map(b=>{
  const kidsMatch=b.kids.filter(k=>match(k.name));
  const selfMatch=match(b.it.name);
  if(!selfMatch&&!kidsMatch.length)return null;
  return {it:b.it,kids:selfMatch?b.kids:kidsMatch};
 }).filter(Boolean);
 const listHtml=shown.length?shown.map(b=>{
  const open=S.expanded.has(b.it.id);
  const doneEff=b.kids.length?b.kids.every(k=>k.done):b.it.done;   // чек статьи = все подстатьи выполнены
  const kidsSum=r2(b.kids.reduce((a,k)=>a+k.amount,0));
  return '<div class="bd-block" data-id="'+b.it.id+'">'+rowHtml(b.it,b.kids.length,open,doneEff)
   +(open?b.kids.map(subRowHtml).join('')+diffRowHtml(r2(b.it.amount-kidsSum)):'')+'</div>';
 }).join(''):'<div class="bd-empty">'+(q?'Ничего не найдено':'Статей пока нет. Добавь первую кнопкой ниже.')+'</div>';
 const filterOn=!!S.filterOn;
 return heroHtml(p)
  +summaryHtml(p)
  +'<section class="bd-card"><div class="bd-card-head">Статьи расходов<span>'+(filterOn?'<button class="bd-fbtn" type="button" data-act="filter" aria-label="Скрыть фильтр">✕</button>':'<button class="bd-fbtn" type="button" data-act="filter" aria-label="Фильтр по статьям"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg></button>')+n+' '+plural(n,['статья','статьи','статей'])+(nd?' · выполнено '+nd:'')+'</span></div>'
  +(filterOn?'<div class="bd-filterrow"><input id="bdFilter" class="value-input" type="search" autocomplete="off" placeholder="Название статьи" value="'+esc(S.filter||'')+'"></div>':'')
  +'<div class="bd-list" id="bdList">'+listHtml+'</div></section>'
  +'<button class="bd-add" type="button" data-act="add"><span class="bd-plus">+</span>Добавить статью</button>';
}
function render(){
 if(S.dragging){S.pendingRender=true;return;}

// ---------- запросы ----------
function newRequestId(){
 if(window.crypto&&typeof crypto.randomUUID==='function')return crypto.randomUUID();
 return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,12);
}
function errText(error){
 const text=error&&error.message?String(error.message):'';
 if(!text||/failed to fetch|networkerror|load failed|network request/i.test(text))return 'Нет связи с сервером. Попробуй ещё раз.';
 return text;
}
function call(path,extra){
 // request_id нужен серверу, чтобы повторная отправка того же действия не выполнилась дважды
 return post('/api/budget/'+path,{...extra,request_id:newRequestId()});
}
function notify(text){
 return ask('Не получилось',text,[{id:'ok',text:'Понятно'}]);
}
function alertError(error){
 if(error&&error.status===401)return;        // сессия закончилась — уже показан экран входа
 uiHaptic('error');
 notify(errText(error));
}
async function load(spinner){
 if(S.loading)return;
 S.loading=true;
 const seq=++S.seq;
 if(spinner||!S.state){S.state=null;render();}
 // бесплатный сервер засыпает: первый запрос может идти долго, предупреждаем
 const wake=setTimeout(()=>{
  const label=document.querySelector('#budgetBody .loader-text');
  if(!S.state&&label)label.textContent='Сервер просыпается, это может занять до минуты…';
 },6000);
 try{
  const data=await get('/api/budget/periods');
  if(seq!==S.seq)return;        // пока грузилось, пользователь уже что-то изменил — не затираем свежее
  adopt(data);
  render();
  revealBudget();
 }catch(error){
  if(error&&error.status===401)return;
  if(seq===S.seq&&!S.state){S.dragging=false;revealBudget();$('budgetBody').innerHTML=errorHtml(errText(error));}
 }finally{
  clearTimeout(wake);
  S.loading=false;
 }
}
function setBusy(on){
 S.busy=on;
 document.querySelectorAll('#budgetBody .bd-add,#budgetBody .bd-month-add').forEach(b=>{b.disabled=on;});
}
// Изменение без формы (месяц, порядок): блокирует повторные нажатия, обновляет экран ответом сервера.
async function mutate(action,extra){
 if(S.busy)return null;
 setBusy(true);
 S.seq++;
 try{
  const data=await call(action,extra);
  S.seq++;
  adopt(data,data.focus);
  S.busy=false;
  render();
  uiHaptic('success');
  return data;
 }catch(error){
  S.busy=false;
  alertError(error);
  if(error&&(error.status===404||error.status===409))load(false);
  else render();
  return null;
 }
}

function parseMoney(raw,title){
 const t=String(raw||'').replace(/[\s\u00a0₽]/g,'').replace(',','.');
 if(!t)return {error:title+': укажи сумму'};
 if(!/^\d+(\.\d{1,2})?$/.test(t))return {error:title+': только число, например 1500 или 1500,50'};
 const n=Number(t);
 if(!(n<=1e9))return {error:title+': слишком большая сумма'};
 return {value:n};
}
// Суммы в полях ввода показываются с пробелами между тысячами: 1 500, 120 000, 1 234 567,50
const groupDigits=s=>s.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
function amountText(n){
 const parts=String(n).split('.');
 return groupDigits(parts[0])+(parts[1]?','+parts[1]:'');
}
// При наборе сумма сразу приобретает разряды; курсор остаётся рядом с тем, что было введено.
function formatMoneyInput(el){
 const raw=el.value;
 const pos=el.selectionStart===null?raw.length:el.selectionStart;
 const before=raw.slice(0,pos).replace(/[^\d.,]/g,'').length;      // сколько цифр и запятых слева от курсора
 const cleaned=raw.replace(/[^\d.,]/g,'');
 const cut=cleaned.search(/[.,]/);
 let whole=cut<0?cleaned:cleaned.slice(0,cut);
 const frac=cut<0?null:cleaned.slice(cut+1).replace(/[.,]/g,'').slice(0,2);
 whole=whole.replace(/^0+(?=\d)/,'');
 const out=groupDigits(whole)+(frac===null?'':','+frac);
 if(out===raw)return;
 el.value=out;
 let seen=0,at=0;
 while(at<out.length&&seen<before){if(/[\d,]/.test(out[at]))seen++;at++;}
 try{el.setSelectionRange(at,at);}catch(e){}
}
$('bdFormBody').addEventListener('input',e=>{
 if(e.target.matches('input[inputmode="decimal"]'))formatMoneyInput(e.target);
 if(e.target.id==='bkName')renderBkSuggest();
});
$('bdFormBody').addEventListener('click',e=>{
 const b=e.target.closest('.bk-sug');
 if(!b)return;
 const item=bkSugList[Number(b.dataset.i)];

// ---------- отметка «выполнено» ----------
// Кружок слева от статьи: сначала меняем экран (быстро), потом сохраняем на сервере.
// Запросы идут по очереди, чтобы быстрые нажатия не перепутались; при ошибке возвращаем прежнее состояние.
let doneChain=Promise.resolve();
function toggleDone(id){
 if(S.dragging||!S.state)return;
 const p=current();
 const it=p&&p.items.find(x=>x.id===id);
 if(!it)return;
 // у статьи с подстатьями чек общий: переключаем её и все подстатьи разом
 const kids=p.items.filter(x=>x.level===2&&x.parent===it.id);
 const cur=kids.length?kids.every(k=>k.done):it.done;
 const next=!cur;
 [it,...kids].forEach(t=>{t.done=next;});
 render();
 selectionHaptic();
 S.doneOps++;
 doneChain=doneChain.then(async()=>{
  try{
   let data=null;
   for(const t of [it,...kids])data=await call('item/done',{id:t.id,done:next});
   S.doneOps--;
   if(S.doneOps===0&&!S.busy&&!S.dragging&&isOpen()){S.seq++;adopt(data);render();}
  }catch(error){
   S.doneOps--;
   alertError(error);
   if(!(error&&error.status===401))load(false);
  }
 });
}

  +'<label class="field"><span>Сумма, ₽</span><input class="value-input" id="bdAmount" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="0" value="'+(it?amountText(it.amount):'')+'"></label>'

function selectPeriod(date){
 if(date===S.sel)return;
 S.sel=date;
 render();
 selectionHaptic();
}
function stepMonth(dir){
 const st=S.state;
 if(!st||!st.periods.length)return;
 const {first,last}=monthBounds();
 const p=current();
 const cur=S.ghost||(p&&p.month);
 if(!cur)return;
 const have=new Set(st.periods.map(x=>x.month));
 let ti=monthIdx(cur)+dir;
 while(ti>=monthIdx(first)&&ti<=monthIdx(last)&&!have.has(keyOf(ti)))ti+=dir;   // пропускаем «дыры» в таблице
 if(ti<monthIdx(first)||ti>monthIdx(last)+MAX_AHEAD)return;
 const target=keyOf(ti);
 if(!have.has(target)){S.ghost=target;render();selectionHaptic();return;}   // дальше последнего месяца — пустой экран
 const inTarget=st.periods.filter(x=>x.month===target);
 let idx;
 if(S.ghost)idx=dir<0?inTarget.length-1:0;
 else{
  const was=st.periods.filter(x=>x.month===p.month).findIndex(x=>x.pay_date===p.pay_date);
  idx=Math.min(Math.max(was,0),inTarget.length-1);
 }
 S.ghost=null;
 S.sel=inTarget[idx].pay_date;
 render();
 selectionHaptic();
}
// Свайп вбок по главной переключает зарплату месяца (3-е ↔ 17-е).
// Срабатывает только на выраженно горизонтальный жест, чтобы не мешать прокрутке и перетаскиванию строк.
(function(){
 const el=$('screen-home');
 let sx=0,sy=0,on=false;
 el.addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return;
  sx=e.touches[0].clientX;sy=e.touches[0].clientY;on=true;
 },{passive:true});
 el.addEventListener('touchend',e=>{
  if(!on)return;on=false;
  if(S.dragging||!S.state||S.ghost)return;
  const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)<56||Math.abs(dx)<Math.abs(dy)*1.4)return;
  const p=current();if(!p)return;
  const inMonth=S.state.periods.filter(x=>x.month===p.month);
  const i=inMonth.findIndex(x=>x.pay_date===p.pay_date),j=i+(dx<0?1:-1);
  if(j<0||j>=inMonth.length)return;
  selectPeriod(inMonth[j].pay_date);
 },{passive:true});
 el.addEventListener('touchcancel',()=>{on=false;});
})();

const B={items:null,deleted:[],pending:new Map(),want:new Map(),pend:new Map(),busy:false,loading:false,seq:0,dragging:false,pendingRender:false,noClick:false};
const basketHost=$('basketBody');

function basketBodyHtml(){
 if(B.items===null)return loadingContent('Загружаю корзину…');

 if(!all.length)return '<section class="bd-card bd-first"><div class="bd-ico">🛒</div><h3>Список покупок пуст</h3>'
  +'<p>Добавь первый товар: название, количество и цену за единицу.</p>'

  +'<div class="bd-list" data-group="open">'+(open.length?open.map(basketRowHtml).join(''):'<div class="bd-empty">Всё куплено. Добавь новые товары кнопкой ниже.</div>')+'</div>'
  +(bought.length?'<div class="bk-bought-label"><span>Куплено</span><button class="bk-uncheck" type="button" data-act="buncheck">Снять все</button></div><div class="bd-list" data-group="bought">'+bought.map(basketRowHtml).join('')+'</div>':'')

function renderBasket(){
 if(B.dragging){B.pendingRender=true;return;}
 const body=basketHost;
 const y=window.scrollY;
 body.innerHTML=basketBodyHtml();
 if(Math.abs(window.scrollY-y)>1)window.scrollTo(0,y);
}
function bkAdopt(data){
 B.items=data.items||[];B.deleted=data.deleted||[];
 // поверх ответа сервера возвращаем значения, по которым ещё летят запросы
 B.want.forEach((o,id)=>{
  const it=B.items.find(x=>x.id===id);
  if(!it){B.want.delete(id);return;}
  if('qty' in o)it.qty=o.qty;
  if('bought' in o)it.bought=o.bought;
 });
}
// регистрируем оптимистичное значение, пока его запрос в очереди/в полёте
function bkWant(id,field,value){
 const key=id+'|'+field;
 B.pend.set(key,(B.pend.get(key)||0)+1);
 let o=B.want.get(id);
 if(!o)B.want.set(id,o={});
 o[field]=value;
 return key;
}
function bkWantDone(key){
 const n=(B.pend.get(key)||1)-1;
 if(n>0){B.pend.set(key,n);return;}
 B.pend.delete(key);
 const p=key.split('|'),id=Number(p[0]),field=p[1];
 const o=B.want.get(id);
 if(o){delete o[field];if(!('qty' in o)&&!('bought' in o))B.want.delete(id);}
 // если запросы упали и список перечитался с сервера — перерисуем уже без оптимистичных значений
 if(B.items)renderBasket();
}
async function basketLoad(){
 if(B.loading||B.busy||B.dragging)return;
 B.loading=true;
 const seq=++B.seq;
 if(B.items===null)renderBasket();
 const wake=setTimeout(()=>{
  const label=basketHost.querySelector('.loader-text');
  if(B.items===null&&label)label.textContent='Сервер просыпается, это может занять до минуты…';
 },6000);
 try{
  const data=await get('/api/basket/items');
  if(seq!==B.seq)return;
  bkAdopt(data);
  renderBasket();
 }catch(error){
  if(error&&error.status===401)return;
  if(seq===B.seq&&B.items===null)basketHost.innerHTML=errorHtml(errText(error));
 }finally{
  clearTimeout(wake);
  B.loading=false;
 }
}
window.BasketLoad=basketLoad;
function bcall(path,extra){
 return post('/api/basket/'+path,{...extra,request_id:newRequestId()});
}
// Быстрые изменения без формы (количество, «куплено»): сначала экран, потом сервер, по очереди.
let basketChain=Promise.resolve();
function basketQty(id,dir){
 if(B.busy||B.dragging||!B.items)return;
 const it=B.items.find(x=>x.id===id);
 if(!it)return;
 if(B.pending.has(id)){
  if(dir>0)cancelPending(id);       // «+» отменяет отложенное удаление
  return;
 }
 const step=(it.unit&&it.unit!=='шт')?0.1:1;
 const q=r2(it.qty+dir*step);
 if(q<=0){startPendingDelete(it);return;}
 it.qty=q;
 renderBasket();
 selectionHaptic();
 const qty=q;
 const wkey=bkWant(id,'qty',q);
 basketChain=basketChain.then(async()=>{
  try{
   const data=await bcall('item/qty',{id,qty});
   bkAdopt(data);
   renderBasket();
  }catch(error){
   alertError(error);
   if(!(error&&error.status===401))basketLoad();
  }finally{
   bkWantDone(wkey);
  }
 });
}
// «−» на минимальном количестве: строка показывает 0 и пульсирует,
// через 4 секунды товар удаляется. «+», карточка или «куплено» отменяют.
const PENDING_DELETE_MS=4000;
function startPendingDelete(it){
 cancelPending(it.id);
 B.pending.set(it.id,{timer:setTimeout(()=>{
  B.pending.delete(it.id);
  basketCommit('item/delete',{id:it.id});
 },PENDING_DELETE_MS)});
 renderBasket();
 selectionHaptic();
 vibrate([40,80,40]);
}
function cancelPending(id){
 const p=B.pending.get(id);
 if(!p)return;
 clearTimeout(p.timer);
 B.pending.delete(id);
 renderBasket();
}
function basketBought(id){
 if(B.busy||B.dragging||!B.items)return;
 const it=B.items.find(x=>x.id===id);
 if(!it)return;
 cancelPending(id);
 const next=!it.bought;
 it.bought=next;
 renderBasket();
 selectionHaptic();
 const wkey=bkWant(id,'bought',next);
 basketChain=basketChain.then(async()=>{
  try{
   const data=await bcall('item/bought',{id,bought:next});
   bkAdopt(data);
   renderBasket();
  }catch(error){
   alertError(error);
   if(!(error&&error.status===401))basketLoad();
  }finally{
   bkWantDone(wkey);
  }
 });
}
// «Снять все»: одним нажатием убирает отметки «куплено» у всех позиций.
function basketUncheckAll(){
 if(B.busy||B.dragging||!B.items)return;
 const ids=bkBoughtItems().map(x=>x.id);
 if(!ids.length)return;
 selectionHaptic();
 B.items.forEach(x=>{if(x.bought)x.bought=false;});
 renderBasket();
 basketChain=basketChain.then(async()=>{
  let last=null;
  for(const id of ids){
   try{
    last=await bcall('item/bought',{id,bought:false});
   }catch(error){
    alertError(error);
    if(!(error&&error.status===401))basketLoad();
    return;
   }
  }
  if(last){bkAdopt(last);renderBasket();}
 });
}

function readBasketForm(){
 const name=$('bkName').value.replace(/\s+/g,' ').trim();
 if(!name){formError('Введи название товара');return null;}
 const q=parseMoney($('bkQty').value,'Количество');
 if(q.error){formError(q.error);return null;}
 if(!(q.value>0)){formError('Количество: укажи число больше 0');return null;}
 const priceRaw=$('bkPrice').value.trim();
 const pr=priceRaw===''?{value:0}:parseMoney(priceRaw,'Цена');
 if(pr.error){formError(pr.error);return null;}
 const unit=$('bkUnit').querySelector('.on').dataset.v;
 return {name,qty:q.value,price:pr.value,unit};
}
// ---------- подсказки названий (как поиск блюд в примере) ----------
const bkFold=t=>String(t||'').toLowerCase().replace(/ё/g,'е');
const bkTokens=t=>bkFold(t).match(/[a-zа-я0-9]+/g)||[];
function bkMatch(tokens,name){
 const folded=bkFold(name),words=[];
 const re=/[a-zа-я0-9]+/g;let m;
 while((m=re.exec(folded)))words.push({w:m[0],start:m.index});
 const used=new Set(),marks=[];let score=0;
 for(const tok of tokens){
  let best=-1,bs=0,ba=0;
  words.forEach((word,i)=>{
   if(used.has(i))return;
   let v=0,at=word.start;
   if(word.w===tok)v=4;
   else if(word.w.startsWith(tok))v=3;
   else if(tok.length>=3&&word.w.includes(tok)){v=1;at=word.start+word.w.indexOf(tok);}
   if(v>bs){best=i;bs=v;ba=at;}
  });
  if(best<0)return null;
  used.add(best);score+=bs;marks.push([ba,ba+tok.length]);
 }
 return {score,marks};
}
function bkHighlight(text,marks){
 const sorted=marks.slice().sort((a,b)=>a[0]-b[0]);
 let html='',pos=0;
 sorted.forEach(([from,to])=>{
  if(from<pos)from=pos;
  if(to<=from)return;
  html+=esc(text.slice(pos,from))+'<b>'+esc(text.slice(from,to))+'</b>';
  pos=to;
 });
 return html+esc(text.slice(pos));
}
let bkSugList=[];
function renderBkSuggest(){
 const box=$('bkSug');
 if(!box)return;
 const input=$('bkName');
 const tokens=input?bkTokens(input.value):[];
 if(!tokens.length||basketItems().some(x=>x.name===String(input.value).trim())){bkSugList=[];box.innerHTML='';return;}
 const found=[];
 bkNames().forEach(name=>{
  const mt=bkMatch(tokens,name);
  if(mt)found.push({name,score:mt.score,marks:mt.marks});
 });
 found.sort((a,b)=>b.score-a.score);
 bkSugList=found.slice(0,6);
 box.innerHTML=bkSugList.map((s,i)=>'<button class="bk-sug" type="button" data-i="'+i+'" style="--i:'+i+'">'+bkHighlight(s.name,s.marks)+'</button>').join('');
}
const bkNames=()=>[...new Set([...basketItems().map(x=>x.name),...B.deleted])];
async function basketCommit(action,extra){
 const data=await bcall(action,extra);
 B.seq++;
 bkAdopt(data);
 renderBasket();
 uiHaptic('success');
}
function openBasketAdd(){
 if(B.busy)return;
 showForm({
  icon:'🛒',title:'Новый товар',html:basketFields(null),saveLabel:'Добавить',
  onSave:async()=>{
   const v=readBasketForm();
   if(!v)return false;
   await basketCommit('item/add',v);
   return true;
  }
 });
 renderBkSuggest();
}
function openBasketEdit(id){
 const it=B.items&&B.items.find(x=>x.id===id);
 if(!it||B.busy)return;
 cancelPending(id);
 showForm({
  icon:'🛒',title:'Товар',html:basketFields(it),
  onSave:async()=>{
   const v=readBasketForm();
   if(!v)return false;
   if(v.name===it.name&&v.qty===it.qty&&v.price===it.price&&v.unit===(it.unit||'шт'))return true;
   await basketCommit('item/update',{id:it.id,...v});
   return true;
  },
  links:[{id:'delete',text:'Удалить запись',danger:true,run:async()=>{
   uiHaptic('error');
   const choice=await ask('Удалить товар?','Товар «'+it.name+'» исчезнет из списка. В таблице запись останется с пометкой удаления.',[{id:'del',type:'destructive',text:'Удалить'},{id:'cancel',type:'cancel'}]);
   if(choice!=='del')return false;
   await basketCommit('item/delete',{id:it.id});
   return true;
  }}]
 });
 renderBkSuggest();
}
async function basketCommitOrder(list,ids){
 // Перетаскивание внутри одной группы: купленные всегда внизу, поэтому порядок
 // для сервера — сначала нескупленные в новом порядке, потом купленные.
 const group=list.dataset.group;
 const cur=basketItems();
 const byId=new Map(cur.map(i=>[i.id,i]));
 const open=bkOpenItems(),bought=bkBoughtItems();
 const order=group==='bought'?[...open.map(i=>i.id),...ids]:[...ids,...bought.map(i=>i.id)];
 const before=B.items.slice();
 B.items=order.map(id=>byId.get(id)).filter(Boolean);
 B.busy=true;
 B.seq++;
 renderBasket();
 try{
  const data=await bcall('reorder',{ids:order});
  B.seq++;
  bkAdopt(data);
  B.busy=false;
  renderBasket();
  uiHaptic('success');
 }catch(error){
  B.busy=false;
  B.items=before;
  renderBasket();
  alertError(error);
  if(error&&(error.status===404||error.status===409))basketLoad();
 }
}
basketHost.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');
 if(t){
  if(t.disabled)return;
  const id=Number(t.dataset.id);
  switch(t.dataset.act){
   case 'badd':openBasketAdd();break;
   case 'bq-dec':basketQty(id,-1);break;
   case 'bq-inc':basketQty(id,1);break;
   case 'bbought':basketBought(id);break;
   case 'buncheck':basketUncheckAll();break;
   case 'retry':basketLoad();break;
  }
  return;
 }
 if(B.noClick)return;
 const row=e.target.closest('.bd-row');
 if(row)openBasketEdit(Number(row.dataset.id));
});

// ---------- перетаскивание статей ----------
// Порядок меняется долгим нажатием на строку в любом месте: удерживаешь HOLD_MS (2 секунды) — строка мерцает,
// потом «поднимается», и её можно тащить. Короткое нажатие по-прежнему открывает окно статьи.
function initRowDrag(container,state,onCommit,onRender,unitSel){
 unitSel=unitSel||'.bd-row';
 const HOLD_MS=2000;
 let d=null,press=null,raf=0,lastY=0;
 const swipes=()=>{};
 // постоянный слушатель: пока тащим строку, страница не должна прокручиваться пальцем
 container.addEventListener('touchmove',ev=>{if(d&&ev.cancelable)ev.preventDefault();},{passive:false});
 function update(){
  if(!d)return;
  const sy=window.scrollY;
  // блоки могут быть разной высоты (статья + подстатьи): границы — края списка
  const lo=-(d.tops[d.from]-d.tops[0]);
  const hi=(d.tops[d.rows.length-1]+d.hs[d.rows.length-1])-(d.tops[d.from]+d.hs[d.from]);
  const dy=Math.max(lo,Math.min(hi,lastY+sy-d.y0));
  d.row.style.transform='translateY('+dy+'px) scale(1.02)';
  // новая позиция — по центрам блоков: сколько блоков выше центра перетаскиваемого
  const draggedCenter=d.tops[d.from]+dy+d.hs[d.from]/2;
  let to=0;
  for(let i=0;i<d.rows.length;i++){
   if(i!==d.from&&d.tops[i]+d.hs[i]/2<draggedCenter)to++;
  }
  if(to===d.to)return;
  d.to=to;
  selectionHaptic();
  d.rows.forEach((r,i)=>{
   if(i===d.from)return;
   let shift=0;
   if(d.from<to&&i>d.from&&i<=to)shift=-d.h;
   else if(d.from>to&&i>=to&&i<d.from)shift=d.h;
   r.style.transform=shift?'translateY('+shift+'px)':'';
  });
 }
 function tick(){
  if(!d)return;
  // у края экрана страница сама прокручивается, чтобы длинный список можно было переставить целиком
  if(lastY<80)window.scrollBy(0,-12);
  else if(lastY>window.innerHeight-90)window.scrollBy(0,12);
  update();
  raf=requestAnimationFrame(tick);
 }
 function start(list,row,pointerId,clientY,handle){
  if(state.busy||state.dragging)return false;
  const rows=[...list.querySelectorAll(unitSel)];
  if(rows.length<2)return false;
  const sy=window.scrollY;
  const tops=rows.map(r=>r.getBoundingClientRect().top+sy);
  const hs=rows.map(r=>r.getBoundingClientRect().height);
  const from=rows.indexOf(row);
  d={id:pointerId,list,row,rows,tops,hs,from,to:from,y0:clientY+sy,h:hs[from],handle};
  lastY=clientY;
  try{handle.setPointerCapture(pointerId);}catch(_){}
  row.classList.add('lifted');
  state.dragging=true;
  swipes(false);
  uiHaptic('success');
  raf=requestAnimationFrame(tick);
  return true;
 }
 function cancelHold(){
  if(!press)return;
  clearTimeout(press.timer);
  clearTimeout(press.visual);
  press.row.classList.remove('holding');
  press=null;
 }
 container.addEventListener('pointerdown',e=>{
  if(d||(e.pointerType==='mouse'&&e.button!==0))return;
  if(e.target.closest('.bd-check,.bk-qty,.bd-chev'))return; // кружок, счётчик и стрелка — отдельные кнопки
  const row=e.target.closest(unitSel);
  const list=row&&row.closest('.bd-list');
  if(!row||!list||state.busy||state.dragging)return;
  if(list.querySelectorAll(unitSel).length<2)return;   // один блок переставлять некуда
  cancelHold();
  const p={id:e.pointerId,ox:e.clientX,oy:e.clientY,y:e.clientY,row};
  // Мерцать начинаем не сразу, а через 0,35 с: короткое нажатие (открыть окно) не должно мигать.
  p.visual=setTimeout(()=>{if(press===p&&row.isConnected)row.classList.add('holding');},350);
  p.timer=setTimeout(()=>{
   if(press!==p)return;
   press=null;
   row.classList.remove('holding');
   if(!row.isConnected)return;          // экран успели перерисовать — начинать нечего
   start(list,row,p.id,p.y,row);
  },HOLD_MS);
  press=p;
 });
 container.addEventListener('pointermove',e=>{
  if(press&&e.pointerId===press.id){
   press.y=e.clientY;
   // палец ушёл в сторону до конца удержания — это не перетаскивание
   if(Math.abs(e.clientX-press.ox)>12||Math.abs(e.clientY-press.oy)>12)cancelHold();
   return;
  }
  if(!d||e.pointerId!==d.id)return;
  lastY=e.clientY;
  update();
 });
 container.addEventListener('contextmenu',e=>{if(e.target.closest('.bd-row'))e.preventDefault();});
 const end=e=>{
  if(press&&e.pointerId===press.id)cancelHold();
  if(!d||e.pointerId!==d.id)return;
  const g=d;
  d=null;
  cancelAnimationFrame(raf);
  try{g.handle.releasePointerCapture(g.id);}catch(_){}
  swipes(true);
  state.noClick=true;
  setTimeout(()=>{state.noClick=false;},350);
  // у блоков разная высота: сдвиг на «сброс» — сумма высот пройденных блоков
  let settle=0;
  if(g.to>g.from){for(let i=g.from+1;i<=g.to;i++)settle+=g.hs[i];}
  else{for(let i=g.to;i<g.from;i++)settle-=g.hs[i];}
  g.row.style.transform='translateY('+settle+'px)';
  g.row.classList.remove('lifted');
  setTimeout(()=>{
   const rows=[...g.list.querySelectorAll(unitSel)];
   g.list.classList.add('noanim');
   rows.forEach(r=>{r.style.transform='';});
   state.dragging=false;
   if(g.to!==g.from&&g.list.isConnected){
    const ref=rows[g.to>g.from?g.to+1:g.to]||null;
    g.list.insertBefore(g.row,ref);
    onCommit([...g.list.querySelectorAll(unitSel)].map(r=>Number(r.dataset.id)),g.list);
   }else if(state.pendingRender){
    onRender();
   }
   state.pendingRender=false;
   requestAnimationFrame(()=>requestAnimationFrame(()=>g.list.classList.remove('noanim')));
  },240);
 };
 container.addEventListener('pointerup',end);
 container.addEventListener('pointercancel',end);
}
initRowDrag(host,S,(ids)=>commitOrder(ids),()=>render(),'.bd-block');
initRowDrag(basketHost,B,(ids,list)=>basketCommitOrder(list,ids),()=>renderBasket());

async function commitOrder(ids){
 const p=current();
 if(!p)return;
 const before=p.items.slice();
 const byId=new Map(before.map(i=>[i.id,i]));
 const kidsOf=new Map();
 before.forEach(i=>{if(i.level===2&&i.parent!=null){
  if(!kidsOf.has(i.parent))kidsOf.set(i.parent,[]);
  kidsOf.get(i.parent).push(i);
 }});
 // ids — только статьи: подстатьи остаются блоком под своей статьёй
 p.items=ids.flatMap(id=>{const it=byId.get(id);return it?[it,...(kidsOf.get(id)||[])]:[];});
 setBusy(true);
 S.seq++;
 try{
  const data=await call('reorder',{pay_date:p.pay_date,ids});
  S.seq++;
  adopt(data,data.focus);
  S.busy=false;
  render();
  uiHaptic('success');
 }catch(error){
  S.busy=false;
  p.items=before;
  render();
  alertError(error);
  if(error&&(error.status===404||error.status===409))load(false);
 }
}

// ---------- вход и выход ----------
function formOpen(){return $('budgetFormBackdrop').classList.contains('visible');}
window.Budget={
 open(){
  hideKeyboard();
  window.scrollTo(0,0);
  S.sel=null;                           // каждый раз начинаем с ближайшей будущей зарплаты
  S.ghost=null;
  S.expanded.clear();                   // подстатьи свёрнуты при каждом открытии
  if(S.state){adopt(S.state);render();} // сразу показываем то, что уже загружали, свежее подтянется следом
  load(false);
 },
 // вернулись на вкладку: подтягиваем изменения, сделанные с другого устройства
 refresh(){
  if(isOpen()&&S.state&&!S.busy&&!S.dragging&&S.doneOps===0&&!asking&&!formOpen())load(false);
  if(!$('screen-basket').hidden&&B.items!==null&&!B.busy&&!B.dragging&&!asking&&!formOpen())basketLoad();
 },
 // выход: ничего из бюджета не остаётся на экране
 close(){
  S.seq++;
  S.state=null;S.sel=null;S.ghost=null;S.busy=false;S.dragging=false;
  S.doneOps=0;S.expanded.clear();S.filterOn=false;S.filter='';
  setSheetLink(null);
  form.busy=false;
  $('budgetFormBackdrop').classList.remove('visible');
  if(asking)closeSheet(null);
  $('budgetBody').innerHTML='';
  B.items=null;B.deleted=[];B.pending.forEach(p=>clearTimeout(p.timer));B.pending.clear();B.want.clear();B.pend.clear();B.busy=false;B.loading=false;B.dragging=false;B.pendingRender=false;B.noClick=false;
  $('basketBody').innerHTML='';
 }
};
