<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Меню бота</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:-apple-system,sans-serif;background:var(--tg-theme-bg-color,#f5f5f5);color:var(--tg-theme-text-color,#222);padding:20px;margin:0}
h2{margin-top:12px}
button{width:100%;padding:16px;margin:8px 0;border:0;border-radius:14px;background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff);font-size:16px}
button:disabled{opacity:.6}
#result{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:16px}
</style>
</head>
<body>
<h2>Меню бота</h2>
<button id="todayButton" onclick="todayBot()">Сегодня</button>
<div id="result"></div>
<script>
const tg=window.Telegram.WebApp;
tg.ready();
tg.expand();

async function todayBot(){
const button=document.getElementById('todayButton');
const result=document.getElementById('result');

if(!tg.initData){
result.textContent='Открой приложение через Telegram';
return;
}

button.disabled=true;
result.textContent='Загружаю данные за сегодня...';

try{
const response=await fetch('https://telegram-daily-sum-bot.onrender.com/api/miniapp',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
initData:tg.initData,
action:'today'
})
});

const data=await response.json();

if(!response.ok){
throw new Error(data.error||'Ошибка сервера');
}

result.textContent=typeof data.result==='string'
?data.result
:JSON.stringify(data.result,null,2);

}catch(error){
result.textContent='Ошибка: '+error.message;
}finally{
button.disabled=false;
}
}
</script>
</body>
</html>
